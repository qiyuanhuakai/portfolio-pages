<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="qiyuanhuakai 的技术作品集">
<title>qiyuanhuakai · Engineering Portfolio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><div class="topin wrap"><a class="brand" href="#top" id="brand"></a><nav class="nav"><a href="#work">WORK</a><a href="#approach">APPROACH</a><a id="githubLink" href="#">GITHUB ↗</a></nav></div></header>
<main id="top"></main>
<footer><div class="foot wrap"><span id="footLeft"></span><span id="footRight"></span></div></footer>
<script src="content.js"></script>
<script>
(() => {
  const p = window.PORTFOLIO;
  if (!p) return;
  document.title = p.meta.title;
  document.querySelector('meta[name="description"]').content = p.meta.description;
  document.getElementById('brand').textContent = p.meta.brand;
  document.getElementById('githubLink').href = p.meta.github;
  document.getElementById('footLeft').textContent = p.footer.left;
  document.getElementById('footRight').textContent = p.footer.right;
  const esc = (s = '') => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const list = (items = []) => `<ul>${items.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>`;
  const evidence = (title, items = []) => `<div class="evidence reveal"><div class="evidenceTitle">${esc(title)}</div><div class="evidenceLinks">${items.map((e) => `<a class="ev" href="${esc(e.url)}"><code>${esc(e.code)}</code><span>${esc(e.text)}</span></a>`).join('')}</div></div>`;
  const hero = `<section class="hero wrap"><div class="eyebrow stagger">${esc(p.hero.eyebrow)}</div><h1 class="stagger">${esc(p.hero.titleBefore)}<em>${esc(p.hero.titleAccent)}</em>${esc(p.hero.titleAfter)}</h1><p class="intro stagger">${esc(p.hero.intro)}</p><div class="actions stagger"><a class="btn primary" href="#work">${esc(p.hero.primaryAction)}</a><a class="btn" href="${esc(p.meta.zip)}">${esc(p.hero.secondaryAction)}</a></div><div class="signal stagger">${p.stats.map((s) => `<div><strong>${esc(s.value)}</strong><span>${esc(s.label)}</span></div>`).join('')}</div></section>`;
  const featured = p.featured.map((item) => {
    const columns = item.columns ? `<div class="split reveal">${item.columns.map((col) => `<div><h4>${esc(col.title)}</h4>${col.items ? list(col.items) : `<p>${esc(col.body)}</p>`}</div>`).join('')}</div>` : '';
    const boundary = item.boundary ? `<div class="boundary reveal"><div class="boundaryBox"><div class="label">${esc(item.boundary.human.label)}</div><h4>${esc(item.boundary.human.title)}</h4>${list(item.boundary.human.items)}</div><div class="arrow">→</div><div class="boundaryBox agent"><div class="label">${esc(item.boundary.agent.label)}</div><h4>${esc(item.boundary.agent.title)}</h4>${list(item.boundary.agent.items)}</div></div><p class="truthNote reveal">${esc(item.boundary.note)}</p>` : '';
    return `<article class="case reveal"><aside class="caseMeta"><div class="num">${esc(item.number)}</div><div class="role">${esc(item.role)}</div><div class="stack">${item.stack.map((s) => `<span>${esc(s)}</span>`).join('')}</div></aside><div class="caseBody"><h3>${esc(item.title)}</h3><p class="lead">${esc(item.lead)}</p>${columns}${boundary}${evidence(item.evidenceTitle, item.evidence)}<a class="textlink" href="${esc(item.link)}">${esc(item.linkLabel)}</a></div></article>`;
  }).join('');
  const compact = p.compact.map((item) => {
    const metrics = item.metrics ? `<div class="metrics reveal">${item.metrics.map((m) => `<div><strong>${esc(m.value)}</strong><span>${esc(m.label)}</span></div>`).join('')}</div>` : '';
    const ev = item.evidence ? evidence('Evidence', item.evidence) : '';
    return `<article class="compact reveal"><div class="num">${esc(item.number)}</div><h3>${esc(item.title)}</h3><p>${esc(item.intro)}</p>${item.items ? list(item.items) : ''}${metrics}${item.body ? `<p>${esc(item.body)}</p>` : ''}${ev}${item.link ? `<a class="textlink" href="${esc(item.link)}">${esc(item.linkLabel)}</a>` : ''}</article>`;
  }).join('');
  const work = `<section class="section wrap" id="work"><div class="sectionHead reveal"><div><div class="eyebrow">${esc(p.workIntro.eyebrow)}</div><h2>${esc(p.workIntro.title)}</h2></div><p>${esc(p.workIntro.body)}</p></div><div class="cases">${featured}</div><div class="compactGrid">${compact}</div></section>`;
  const approach = `<section class="section wrap" id="approach"><div class="method reveal"><div class="methodIntro"><div class="eyebrow">${esc(p.approach.eyebrow)}</div><h2>${esc(p.approach.title)}</h2></div><div><div class="principles">${p.approach.principles.map((x) => `<div class="principle reveal"><span class="n">${esc(x.number)}</span><b>${esc(x.title)}</b><p>${esc(x.body)}</p></div>`).join('')}</div><div class="aiNote reveal"><div class="label">${esc(p.approach.aiLabel)}</div><h3>${esc(p.approach.aiTitle)}</h3><p>${esc(p.approach.aiBody)}</p></div></div></div></section>`;
  document.getElementById('top').innerHTML = hero + work + approach;
})();
</script>
<script src="motion.js"></script>
</body>
</html>
